<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Assistant</title>
    <meta name="description" content="Parafrase, ringkas, dan perbaiki teks dengan AI secara cepat dan mudah.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7170B8',
                        accent: '#A54100',
                        neutral: '#777881',
                        customGreen: '#00A86B'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col bg-gray-50">

    <div id="toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="flex items-center gap-3 px-4 py-3 text-sm text-green-800 border border-green-200 rounded-xl bg-white shadow-lg" role="alert">
            <svg class="w-4 h-4 text-customGreen flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
            </svg>
            <span class="font-medium" id="toast-message">Teks berhasil disalin!</span>
        </div>
    </div>

    <div id="error-toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="flex items-center gap-3 px-4 py-3 text-sm text-red-700 border border-red-200 rounded-xl bg-white shadow-lg" role="alert">
            <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/>
            </svg>
            <span class="font-medium" id="error-toast-message">Terjadi kesalahan.</span>
        </div>
    </div>

    <!-- ======= Header Navbar ======= -->
    <header class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.reload()">
                <span class="text-lg font-bold text-gray-900 tracking-tight">ButterText</span>
            </div>
            
            <div id="auth-section" class="flex items-center gap-2">
                <!-- Authentication status gets injected here by app.js -->
                <button id="auth-btn" onclick="window.location.href = '/login'" 
                    class="px-4 py-2 text-xs font-semibold text-white bg-primary hover:bg-indigo-700 rounded-xl transition-all shadow-sm"
                    style="display: none;">
                    Masuk / Daftar
                </button>
            </div>
        </div>
    </header>

    <!-- ======= Main Content ======= -->
    <main class="flex-grow w-full max-w-3xl mx-auto px-4 sm:px-6 py-10 space-y-6">

        <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">ButterText</h1>
            <p class="text-sm text-neutral">Parafrase, ringkas, dan perbaiki teks dengan AI</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-1">
                    <button id="tab-paraphrase" onclick="switchTab('paraphrase')"
                        class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 bg-primary text-white"
                        aria-label="Mode Parafrase">
                        Parafrase
                    </button>
                    <button id="tab-summary" onclick="switchTab('summary')"
                        class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-gray-500 border border-gray-200 hover:border-gray-300 hover:text-gray-700"
                        aria-label="Mode Ringkasan">
                        Ringkasan
                    </button>
                    <button id="tab-grammar" onclick="switchTab('grammar')"
                        class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 text-gray-500 border border-gray-200 hover:border-gray-300 hover:text-gray-700"
                        aria-label="Mode Grammar">
                        Grammar
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <label for="provider-select" class="text-xs font-semibold text-gray-400">Model AI:</label>
                    <select id="provider-select" class="px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary bg-white text-gray-700 cursor-pointer">
                        <option value="gemini">Gemini 3 Flash</option>
                        <option value="deepseek">DeepSeek Chat</option>
                    </select>
                </div>
            </div>

            <!-- Textarea -->
            <div class="relative">
                <textarea
                    id="input-text"
                    rows="6"
                    placeholder="Masukkan teks di sini..."
                    class="w-full p-4 text-sm text-gray-800 bg-white rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none transition-all resize-none placeholder-gray-400"
                ></textarea>
                <div class="absolute bottom-3 right-3 flex items-center gap-1.5">
                    <span class="text-xs text-gray-300" id="char-count">0</span>
                    <svg class="w-3.5 h-3.5 text-gray-300" fill="currentColor" viewBox="0 0 6 6">
                        <path d="M6 6H4V4h2v2zM6 3H4V1h2v2zM3 6H1V4h2v2z"/>
                    </svg>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <button id="btn-clear" onclick="clearText()"
                    class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-gray-500 rounded-xl border border-gray-200 hover:bg-gray-50 hover:text-gray-700 focus:outline-none transition-all"
                    aria-label="Bersihkan Input">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                    Clear
                </button>
                <button id="btn-proses" onclick="processText()"
                    class="inline-flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-primary rounded-xl hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition-all shadow-sm"
                    aria-label="Proses Teks">
                    <svg id="spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                    </svg>
                    <svg id="magic-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l1.5 1.5M3 8h2M8 3v2M19 21l-7-7M4.5 19.5l10-10a1.5 1.5 0 012.12 0l1.88 1.88a1.5 1.5 0 010 2.12l-10 10L4.5 19.5z"/>
                    </svg>
                    Proses
                </button>
            </div>
        </div>

        <!-- ======= Skeleton Loading Card ======= -->
        <div id="skeleton-card" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4 hidden">
            <div class="flex justify-between items-center">
                <div class="h-4 w-12 shimmer-bg rounded-md"></div>
                <div class="h-6 w-20 shimmer-bg rounded-full"></div>
            </div>
            <div class="space-y-2.5">
                <div class="h-3.5 w-full shimmer-bg rounded"></div>
                <div class="h-3.5 w-5/6 shimmer-bg rounded"></div>
                <div class="h-3.5 w-4/6 shimmer-bg rounded"></div>
                <div class="h-3.5 w-3/6 shimmer-bg rounded"></div>
            </div>
            <div class="flex justify-end">
                <div class="h-8 w-16 shimmer-bg rounded-xl"></div>
            </div>
        </div>

        <div id="result-card" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4 hidden">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2 font-semibold text-sm text-gray-800">
                    <svg class="w-4 h-4 text-customGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Hasil
                </div>
                <span id="active-badge"
                    class="px-2.5 py-0.5 text-xs font-medium text-gray-500 bg-gray-100 rounded-md capitalize">
                    Parafrase
                </span>
            </div>

            <!-- Output text area -->
            <div id="output-text"
                class="p-0 text-sm text-gray-700 leading-relaxed break-words whitespace-pre-wrap select-text min-h-[80px]">
            </div>

            <div class="flex justify-end pt-2 border-t border-gray-50">
                <button id="btn-copy" onclick="copyResult()"
                    class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-customGreen rounded-xl hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100 transition-all shadow-sm"
                    aria-label="Salin Hasil">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                    </svg>
                    Copy
                </button>
            </div>
        </div>

        <!-- ======= Quick Prompt Templates ======= -->
        <div class="space-y-2.5 pb-6">
            <p class="text-xs font-medium text-gray-400">Contoh Penggunaan:</p>
            <div class="flex flex-wrap gap-2">
                <button onclick="applyTemplate('Buat lebih formal', 'paraphrase')"
                    class="px-3.5 py-1.5 text-xs font-medium text-gray-500 bg-white border border-gray-200 rounded-full hover:border-secondary hover:text-secondary transition-all focus:outline-none">
                    Buat lebih formal
                </button>
                <button onclick="applyTemplate('Ringkas jadi 1 paragraf', 'summary')"
                    class="px-3.5 py-1.5 text-xs font-medium text-gray-500 bg-white border border-gray-200 rounded-full hover:border-secondary hover:text-secondary transition-all focus:outline-none">
                    Ringkas jadi 1 paragraf
                </button>
                <button onclick="applyTemplate('Perbaiki ejaan &amp; tanda baca', 'grammar')"
                    class="px-3.5 py-1.5 text-xs font-medium text-gray-500 bg-white border border-gray-200 rounded-full hover:border-secondary hover:text-secondary transition-all focus:outline-none">
                    Perbaiki ejaan &amp; tanda baca
                </button>
            </div>
        </div>

    </main>

    <!-- ======= Auth Modal (Login / Register) ======= -->
    <div id="auth-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white w-full max-w-md p-6 rounded-2xl border border-gray-100 shadow-xl space-y-4 animate-modal-in">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 id="auth-modal-title" class="text-lg font-bold text-gray-900">Masuk ke ButterText</h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <form id="auth-form" onsubmit="submitAuthForm(event)" class="space-y-4">
                <div class="space-y-1">
                    <label for="auth-username" class="text-xs font-semibold text-gray-500">Username</label>
                    <input type="text" id="auth-username" required placeholder="Masukkan username..."
                        class="w-full p-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none transition-all">
                </div>
                
                <div class="space-y-1">
                    <label for="auth-password" class="text-xs font-semibold text-gray-500">Password</label>
                    <input type="password" id="auth-password" required placeholder="Masukkan password..."
                        class="w-full p-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none transition-all">
                </div>
                
                <button type="submit" id="auth-submit-btn"
                    class="w-full py-3 text-sm font-semibold text-white bg-primary rounded-xl hover:bg-indigo-700 transition-all shadow-sm">
                    Masuk
                </button>
            </form>
            
            <div class="text-center pt-2">
                <p class="text-xs text-gray-500">
                    <span id="auth-switch-text">Belum punya akun?</span>
                    <button onclick="switchAuthMode()" id="auth-switch-btn" class="text-primary font-semibold hover:underline focus:outline-none ml-1">
                        Daftar Sekarang
                    </button>
                </p>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-gray-300 py-4 border-t border-gray-100 bg-white">
        &copy; 2026 ButterText. Semua Hak Dilindungi.
    </footer>

    <script src="app.js"></script>
</body>
</html>
