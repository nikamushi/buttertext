<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ButterText - Masuk atau Daftar</title>
    <meta name="description" content="Masuk atau buat akun baru di ButterText — Asisten AI untuk parafrase, ringkasan, dan koreksi tata bahasa.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #EEF2FF;
            --green: #00A86B;
            --danger: #EF4444;
            --gray-50: #FAFAFC;
            --gray-100: #F4F4F5;
            --gray-200: #E4E4E7;
            --gray-400: #A1A1AA;
            --gray-500: #71717A;
            --gray-700: #3F3F46;
            --gray-900: #18181B;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background decoration */
        .bg-decoration {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
        }
        .bg-blob-1 {
            width: 500px; height: 500px;
            background: var(--primary);
            top: -150px; right: -100px;
        }
        .bg-blob-2 {
            width: 350px; height: 350px;
            background: var(--green);
            bottom: -100px; left: -80px;
        }

        /* Layout */
        .page-wrapper {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* Header Logo */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-name {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -0.03em;
        }
        .brand-name span {
            color: var(--primary);
        }
        .brand-tagline {
            font-size: 0.875rem;
            color: var(--gray-400);
            margin-top: 0.375rem;
        }

        /* Auth Card */
        .auth-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 1.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem;
        }

        /* Tab Switch */
        .tab-switch {
            display: flex;
            background: var(--gray-100);
            border-radius: 0.75rem;
            padding: 4px;
            margin-bottom: 2rem;
            gap: 4px;
        }
        .tab-switch button {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 0.625rem;
            border: none;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: var(--gray-500);
        }
        .tab-switch button.active {
            background: var(--white);
            color: var(--primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-500);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--gray-900);
            background: var(--white);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        input::placeholder {
            color: var(--gray-400);
        }

        /* Error Message */
        .field-error {
            font-size: 0.75rem;
            color: var(--danger);
            margin-top: 0.35rem;
            display: none;
        }
        .field-error.show { display: block; }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 2px 12px rgba(79,70,229,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 18px rgba(79,70,229,0.35);
            transform: translateY(-1px);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner in button */
        .btn-spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-submit.loading .btn-spinner { display: block; }
        .btn-submit.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: var(--gray-400);
            font-size: 0.75rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        /* Back to home */
        .back-link {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--gray-400);
            font-size: 0.8125rem;
            text-decoration: none;
            justify-content: center;
            margin-top: 1.5rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--primary); }

        /* Alert / Toast */
        .alert-box {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.8125rem;
            font-weight: 500;
            display: none;
            margin-bottom: 1rem;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-box.show { display: flex; }
        .alert-box.error { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .alert-box.success { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }

        /* Footer */
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray-400);
            padding: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="bg-decoration">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
    </div>

    <div class="page-wrapper">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-name">Butter<span>Text</span></div>
            <p class="brand-tagline">Asisten AI untuk teks yang lebih baik</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">

            <!-- Tab Switch -->
            <div class="tab-switch" role="tablist">
                <button id="tab-login" class="active" onclick="switchMode('login')" role="tab">Masuk</button>
                <button id="tab-register" onclick="switchMode('register')" role="tab">Daftar</button>
            </div>

            <!-- Alert Box -->
            <div id="alert-box" class="alert-box" role="alert">
                <svg id="alert-icon" class="flex-shrink-0" width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span id="alert-message"></span>
            </div>

            <!-- Auth Form -->
            <form id="auth-form" onsubmit="submitForm(event)" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="cth: budi123" autocomplete="username" required>
                    <span class="field-error" id="username-error">Username minimal 3 karakter.</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    <span class="field-error" id="password-error">Password minimal 6 karakter.</span>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span class="btn-spinner"></span>
                    <span class="btn-text" id="btn-label">Masuk</span>
                </button>
            </form>

            <div class="divider">atau</div>

            <a href="/" class="back-link">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Kembali ke Beranda
            </a>
        </div>

    </div>

    <footer>
        &copy; 2026 ButterText. Semua Hak Dilindungi.
    </footer>

    <script>
        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const btnLabel = document.getElementById('btn-label');
            const passwordInput = document.getElementById('password');

            clearAlert();
            clearErrors();
            document.getElementById('auth-form').reset();

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
                btnLabel.textContent = 'Masuk';
                passwordInput.autocomplete = 'current-password';
            } else {
                tabReg.classList.add('active');
                tabLogin.classList.remove('active');
                btnLabel.textContent = 'Daftar Akun';
                passwordInput.autocomplete = 'new-password';
            }
        }

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alert-box');
            const msg = document.getElementById('alert-message');
            box.className = `alert-box show ${type}`;
            msg.textContent = message;
        }

        function clearAlert() {
            document.getElementById('alert-box').className = 'alert-box';
        }

        function clearErrors() {
            document.getElementById('username-error').classList.remove('show');
            document.getElementById('password-error').classList.remove('show');
            document.getElementById('username').style.borderColor = '';
            document.getElementById('password').style.borderColor = '';
        }

        function setFieldError(fieldId, errorId) {
            const input = document.getElementById(fieldId);
            const error = document.getElementById(errorId);
            input.style.borderColor = 'var(--danger)';
            error.classList.add('show');
        }

        function setLoading(state) {
            const btn = document.getElementById('submit-btn');
            if (state) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function submitForm(e) {
            e.preventDefault();

            clearAlert();
            clearErrors();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            let valid = true;
            if (!username || username.length < 3) {
                setFieldError('username', 'username-error');
                valid = false;
            }
            if (!password || password.length < 6) {
                setFieldError('password', 'password-error');
                valid = false;
            }
            if (!valid) return;

            const url = currentMode === 'login' ? '/api/login' : '/api/register';
            setLoading(true);

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert(data.detail || 'Terjadi kesalahan. Coba lagi.');
                    return;
                }

                if (currentMode === 'login') {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);
                    showAlert(`Selamat datang, ${data.username}! Mengalihkan...`, 'success');
                    setTimeout(() => {
                        window.location.href = data.role === 'admin' ? '/admin' : '/';
                    }, 1000);
                } else {
                    showAlert('Akun berhasil didaftarkan! Silakan masuk.', 'success');
                    setTimeout(() => switchMode('login'), 1500);
                }

            } catch (err) {
                showAlert('Tidak dapat terhubung ke server. Coba lagi.');
            } finally {
                setLoading(false);
            }
        }

        // If already logged in, redirect to home
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>

</body>
</html>
